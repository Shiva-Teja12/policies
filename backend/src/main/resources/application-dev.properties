# ==============================
# DEVELOPMENT PROFILE
# PostgreSQL local database
# ==============================

# ------------------------------
# PostgreSQL datasource
# ------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hrmspolicies_2}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Shiva@2812}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------
# JPA / Hibernate
# Development only
# ------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# PostgreSQL uses lowercase unquoted identifiers
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ------------------------------
# Database connection pool
# ------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ------------------------------
# Logging
# ------------------------------
logging.level.root=INFO
logging.level.com.example.hrmspolicies2=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.web=INFO