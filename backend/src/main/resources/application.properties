# ==============================
# COMMON CONFIGURATION
# (shared by every profile; profile-specific files override
# individual keys - see application-dev.properties / application-prod.properties)
# ==============================

spring.application.name=hrmspolicies2

server.port=${SERVER_PORT:8080}

# Active profile - override with:
#   java -jar app.jar --spring.profiles.active=prod
#   or environment variable SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==============================
# JWT (externalized - never hardcode secrets in real deployments;
# override JWT_SECRET via an environment variable in production)
# ==============================
jwt.secret=${JWT_SECRET:MySuperSecretKeyForHrmsPolicies2ApplicationJwtToken2026}
jwt.expiration=${JWT_EXPIRATION:86400000}
# ==============================
# CORS
# ==============================
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# ==============================
# Swagger / OpenAPI
# ==============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==============================
# Jackson
# ==============================
spring.jackson.default-property-inclusion=non_null

# ==============================
# POLICY NOTIFICATIONS
# Keep false during local development.
# ==============================
notifications.mail-enabled=${MAIL_ENABLED:false}
notifications.from-email=${MAIL_FROM:noreply@enfec.com}

# ==============================
# SMTP
# Required only when MAIL_ENABLED=true
# ==============================
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

MAIL_ENABLED=false

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email