# ==============================
# COMMON CONFIGURATION
# ==============================

spring.application.name=hrmspolicies2

server.port=${SERVER_PORT:8080}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}


# ==============================
# DATABASE - POSTGRESQL
# ==============================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ==============================
# JWT
# ==============================

jwt.secret=${JWT_SECRET}

jwt.expiration=${JWT_EXPIRATION:86400000}


# ==============================
# CORS
# ==============================

spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

spring.web.cors.allowed-headers=*


# ==============================
# FRONTEND
# Used for reset-password email link
# ==============================

app.frontend-url=${FRONTEND_URL:http://localhost:3000}


# ==============================
# SWAGGER / OPENAPI
# ==============================

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.api-docs.path=/v3/api-docs


# ==============================
# JACKSON
# ==============================

spring.jackson.default-property-inclusion=non_null


# ==============================
# POLICY NOTIFICATIONS
# ==============================

notifications.mail-enabled=${MAIL_ENABLED:false}

notifications.from-email=${MAIL_FROM:noreply@enfec.com}


# ==============================
# SMTP / GMAIL
#
# For Gmail:
#
# MAIL_ENABLED=true
# MAIL_HOST=smtp.gmail.com
# MAIL_PORT=587
# MAIL_USERNAME=yourgmail@gmail.com
# MAIL_PASSWORD=your Google App Password
# MAIL_SMTP_AUTH=true
# MAIL_STARTTLS=true
#
# Never commit Gmail password/App Password.
# ==============================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}

spring.mail.port=${MAIL_PORT:587}

spring.mail.username=${MAIL_USERNAME}

spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}

spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}

spring.mail.properties.mail.smtp.connectiontimeout=5000

spring.mail.properties.mail.smtp.timeout=5000

spring.mail.properties.mail.smtp.writetimeout=5000


# ==============================
# GOOGLE OAUTH2
# ==============================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}

spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.scope=openid,profile,email


# ============================================================
# ACTUATOR
# ============================================================
management.endpoints.web.base-path=/actuator

management.endpoint.health.show-details=when_authorized
management.health.defaults.enabled=true

management.info.env.enabled=true

info.app.name=HRMS Policies
info.app.description=HRMS Policies Management Service
info.app.version=0.0.1-SNAPSHOT